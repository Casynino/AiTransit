<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AITRANSIT">
  <!--
    The favicon: the route mark on a navy tile.

    A tile rather than the bare mark, because the mark is wide and a browser tab
    gives it a square — floating it in that square shrinks it to nothing. On the
    tile it can run corner to corner and still read at 16px, which is the only
    size that actually matters here.

    The route goes stone-white rather than emerald: emerald on navy at 16px is
    two dark colours touching. The copper head survives and is what makes the
    icon identifiable in a row of tabs.
  -->
  <rect width="64" height="64" rx="14" fill="#0A1B33"/>
  <g transform="translate(4 5) scale(0.86)">
    <circle cx="6" cy="48" r="4.6" fill="#FAF8F4"/>
    <path d="M6.00 48.00 Q34.00 48.00 57.00 27.00" fill="none" stroke="#FAF8F4"
          stroke-width="5.2" stroke-linecap="round"/>
    <path d="M61.87 22.55 L58.23 34.28 L49.87 25.12 Z" fill="#C77A2B"/>
  </g>
</svg>
