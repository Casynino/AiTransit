<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AITRANSIT">
  <!--
    The favicon: the emblem alone, knocked out of the brand navy.

    Just the mark, never the wordmark. At 16px "AITRANSIT" is a grey smear, and
    a favicon is recognised by its shape rather than read. The letter is white
    rather than navy so the tile works on a dark browser chrome as well as a
    light one, and the arrow keeps its cyan so the icon is identifiably ours at
    a glance in a row of tabs.
  -->
  <rect width="128" height="128" rx="26" fill="#103B7C"/>
  <g transform="translate(18 24) scale(0.72)">
    <path fill="#ffffff" fill-rule="evenodd"
      d="M42.5 6 L57.5 6 L86 90 L68 90 L61.5 69 L33 69 L26.5 90 L8.5 90 Z M38 54 L57 54 L47.5 23 Z"/>
    <path fill="#2BAEE6"
      d="M50 47 L104 47 L92 33 L112 33 L128 52 L112 71 L92 71 L104 57 L54 57 Z"/>
  </g>
</svg>
