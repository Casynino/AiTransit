<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AITRANSIT">
  <!-- The favicon: the A on a navy tile so it can run edge to edge and still
       read at 16px. The route goes stone-white — emerald on navy at that size
       is two dark colours touching — and the copper head is what makes the tab
       identifiable in a row of them. -->
  <rect width="64" height="64" rx="14" fill="#0A1B33"/>
  <g transform="translate(6.5 6) scale(0.72)">
    <path fill="#FAF8F4" fill-rule="evenodd"
      d="M24.60 6.00 L35.40 6.00 L54.00 58.00 L40.50 58.00 L34.80 30.00 L25.20 30.00 L19.50 58.00 L6.00 58.00 Z M30.00 17.20 L33.30 30.00 L26.70 30.00 Z"/>
    <path d="M14 41 L58 33" fill="none" stroke="#16967A" stroke-width="5" stroke-linecap="round"/>
    <path d="M65.28 31.68 L54.48 39.33 L52.47 28.31 Z" fill="#C77A2B"/>
  </g>
</svg>
